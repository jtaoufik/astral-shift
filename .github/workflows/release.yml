name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-14 }
          - { arch: x86_64, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    env:
      SIGN_IDENTITY: "Developer ID Application: Taoufik Jabbari (URB3N9DX5X)"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Import signing certificate into a temporary keychain
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          KCPASS="$(uuidgen)"
          echo "$MAC_CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MAC_CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KC"
      - name: Write notary API key
        env:
          MAC_NOTARY_KEY: ${{ secrets.MAC_NOTARY_KEY }}
        run: |
          echo "$MAC_NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
      - name: Build, sign, notarize, staple
        env:
          NOTARY_KEY_ID: ${{ secrets.MAC_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MAC_NOTARY_ISSUER }}
          PYTHON: python
        run: scripts/build-macos.sh
      - name: Clean up keys
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/notary.p8"
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
      - uses: actions/upload-artifact@v4
        with:
          name: AstralShift-macOS-${{ matrix.arch }}
          path: dist/AstralShift-macOS-${{ matrix.arch }}.dmg
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libdbus-1-3 libfontconfig1 xvfb desktop-file-utils
      - run: python -m pip install -e ".[dev]"
      - run: PYTHON=python scripts/build-linux.sh
      - name: Smoke test the AppImage
        run: xvfb-run -a env APPIMAGE_EXTRACT_AND_RUN=1 dist/AstralShift-Linux-x86_64.AppImage --version
      - uses: actions/upload-artifact@v4
        with:
          name: AstralShift-Linux-x86_64
          path: dist/AstralShift-Linux-x86_64.AppImage
          if-no-files-found: error

  publish:
    # Only on a real tag push: workflow_dispatch builds and signs but never creates a release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - run: ls -l assets
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/AstralShift-macOS-arm64.dmg
            assets/AstralShift-macOS-x86_64.dmg
            assets/AstralShift-Linux-x86_64.AppImage
          generate_release_notes: true
